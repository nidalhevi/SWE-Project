[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chessvision"
version = "0.1.0"
description = "Photo -> move -> PGN front end for the chess-c engine (pass V1: engine bridge + decoder)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=7", "chess>=1.10"]
ml = ["torch>=2.2", "torchvision>=0.17"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chessvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
