name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The differential test needs python-chess; `make test` prints SKIP without it,
      # so install it here to make CI run the full check.
      - name: Install python-chess
        run: python -m pip install --quiet chess

      - name: Toolchain
        run: clang --version && make --version | head -1

      - name: Build (debug, sanitizers)
        run: make debug

      - name: Build (release)
        run: make release

      - name: Test
        run: make test

  vision:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: python -m pip install --quiet numpy opencv-python-headless pytest chess
      - name: Build engine (release)
        run: make release
      - name: Vision tests
        run: python -m pytest -q vision/tests
      - name: Decoder evaluation (smoke)
        run: python vision/scripts/eval_decoder.py --games 10 --plies 40
