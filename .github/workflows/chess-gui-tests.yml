name: Chess GUI integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chess_app/requirements-test.txt
      - name: Install Qt runtime libraries and Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 fonts-dejavu-core stockfish
      - name: Install Python test dependency
        run: python -m pip install -r chess_app/requirements-test.txt
      - name: Build C referee
        run: make release CC=gcc
      - name: Run full integration and regression suite
        run: python chess_app/run_tests.py
      - name: Check real Stockfish connection
        run: python chess_app/check_engine.py --bin /usr/games/stockfish
